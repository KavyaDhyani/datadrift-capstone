# ingress-nginx for kind: bind host ports 80/443 on the node labelled ingress-ready=true
# (see kind-config.yaml), so http://datadrift.localtest.me reaches the controller.
controller:
  hostPort:
    enabled: true
  service:
    type: NodePort
  nodeSelector:
    ingress-ready: "true"
    kubernetes.io/os: linux
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Equal
      effect: NoSchedule
  publishService:
    enabled: false
  extraArgs:
    publish-status-address: localhost
  admissionWebhooks:
    enabled: false
