# Local single-node cluster for the demo. Ports 80/443 on the host go to the ingress controller.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: datadrift
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
