apiVersion: v1
kind: Service
metadata:
  name: {{ include "datadrift.fullname" . }}-frontend
  labels:
    {{- include "datadrift.labels" . | nindent 4 }}
    {{- include "datadrift.selector" (list . "frontend") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "datadrift.selector" (list . "frontend") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
