{{- $name := include "datadrift.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-backend
  labels:
    {{- include "datadrift.labels" . | nindent 4 }}
    {{- include "datadrift.selector" (list . "backend") | nindent 4 }}
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.backend.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "datadrift.selector" (list . "backend") | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels:
        {{- include "datadrift.labels" . | nindent 8 }}
        {{- include "datadrift.selector" (list . "backend") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        # Wait for Postgres so the first start does not crash-loop on migrations.
        - name: wait-for-postgres
          image: {{ .Values.postgres.image }}
          command: ["sh", "-c", "until pg_isready -h {{ $name }}-postgres -p 5432 -U {{ .Values.postgres.username }}; do echo waiting for postgres; sleep 2; done"]
          securityContext:
            allowPrivilegeEscalation: false
      containers:
        - name: backend
          image: {{ include "datadrift.image" (dict "name" "backend" "image" .Values.backend.image) }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: {{ $name }}-db, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $name }}-db, key: password } }
            - name: DATABASE_URL
              value: "postgresql+psycopg://$(DB_USER):$(DB_PASSWORD)@{{ $name }}-postgres:5432/{{ .Values.postgres.database }}"
            - name: DRIFT_THRESHOLD
              value: {{ .Values.backend.driftThreshold | quote }}
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
