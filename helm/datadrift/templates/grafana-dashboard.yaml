{{- if .Values.monitoring.enabled }}
# Picked up by the Grafana dashboard sidecar (label grafana_dashboard=1).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "datadrift.fullname" . }}-dashboard
  labels:
    {{- include "datadrift.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  datadrift-overview.json: |-
{{ .Files.Get "dashboards/datadrift-overview.json" | replace "__NAMESPACE__" .Release.Namespace | indent 4 }}
{{- end }}
