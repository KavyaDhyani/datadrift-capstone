apiVersion: v1
kind: Secret
metadata:
  name: {{ include "datadrift.fullname" . }}-db
  labels:
    {{- include "datadrift.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.postgres.username | quote }}
  password: {{ .Values.postgres.password | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "datadrift.fullname" . }}-postgres
  labels:
    {{- include "datadrift.labels" . | nindent 4 }}
    {{- include "datadrift.selector" (list . "postgres") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "datadrift.selector" (list . "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "datadrift.fullname" . }}-postgres
  labels:
    {{- include "datadrift.labels" . | nindent 4 }}
    {{- include "datadrift.selector" (list . "postgres") | nindent 4 }}
spec:
  serviceName: {{ include "datadrift.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "datadrift.selector" (list . "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "datadrift.labels" . | nindent 8 }}
        {{- include "datadrift.selector" (list . "postgres") | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: {{ include "datadrift.fullname" . }}-db, key: username } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "datadrift.fullname" . }}-db, key: password } }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.postgres.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
