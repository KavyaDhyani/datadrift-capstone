services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: datadrift
      POSTGRES_USER: datadrift
      POSTGRES_PASSWORD: datadrift
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datadrift -d datadrift"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    image: datadrift-backend:local
    environment:
      DATABASE_URL: postgresql+psycopg://datadrift:datadrift@postgres:5432/datadrift
      DRIFT_THRESHOLD: "0.30"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    image: datadrift-frontend:local
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:8080"

volumes:
  postgres-data:
