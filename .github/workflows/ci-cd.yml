name: DataDrift CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  TRIVY_VERSION: "0.75.0"

jobs:
  # ---------------------------------------------------------------- quality gates
  backend-tests:
    name: Backend lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Run pytest
        run: pytest -v

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  validate-iac:
    name: Validate Terraform + Helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: terraform fmt / init / validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - uses: azure/setup-helm@v4
      - name: helm lint
        run: helm lint helm/datadrift --set backend.image.tag=ci --set frontend.image.tag=ci

  # ---------------------------------------------------------------- build, scan, publish
  build-scan-push:
    name: Build, scan & push (${{ matrix.service }})
    needs: [backend-tests, frontend-build, validate-iac]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Compute image name (GHCR needs a lowercase owner)
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/datadrift-${{ matrix.service }}:${GITHUB_SHA}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          load: true
          tags: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Trivy scan (fails on fixable HIGH/CRITICAL CVEs)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            "aquasec/trivy:${TRIVY_VERSION}" image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
            "$IMAGE"
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: github.event_name != 'pull_request'
        run: |
          docker push "$IMAGE"
          echo "### ${{ matrix.service }} image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE\` — built, scanned clean, pushed" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------- deploy
  gitops:
    name: GitOps - bump image tag for Argo CD
    needs: build-scan-push
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Write the new tag to helm/datadrift/values-gitops.yaml
        run: |
          git fetch -q origin main
          if [ "$(git rev-parse origin/main)" != "${GITHUB_SHA}" ]; then
            echo "::notice::main has moved on since ${GITHUB_SHA}; the newer run will update the tag."
            exit 0
          fi
          sed -i -E "s/^(    tag: ).*/\1${GITHUB_SHA}/" helm/datadrift/values-gitops.yaml
          git diff --stat
          # Commit as the person who pushed, through their GitHub noreply address.
          git -c user.name="${GITHUB_ACTOR}" \
              -c user.email="${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com" \
              commit -am "Deploy ${GITHUB_SHA::7} to the cluster via Argo CD [skip ci]"
          git push origin HEAD:main
          echo "Argo CD will roll out \`${GITHUB_SHA}\` from \`helm/datadrift/values-gitops.yaml\`." >> "$GITHUB_STEP_SUMMARY"
