# Lab 1: a Deployment whose image tag does not exist.
# Symptom: pod stuck in ErrImagePull / ImagePullBackOff.
# Diagnose: kubectl describe pod -n datadrift -l app=drift-worker   (see the Events section)
# Fix:      point the image at a tag that exists, or delete the Deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drift-worker
  namespace: datadrift
spec:
  replicas: 1
  selector:
    matchLabels: { app: drift-worker }
  template:
    metadata:
      labels: { app: drift-worker }
    spec:
      containers:
        - name: worker
          image: ghcr.io/kavyadhyani/datadrift-backend:does-not-exist
