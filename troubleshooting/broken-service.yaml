# Lab 2: a Service whose selector matches no pods.
# Symptom: the Service exists but has no endpoints, so requests to it time out / are refused.
# Diagnose: kubectl get endpoints -n datadrift datadrift-api-v2
#           kubectl get pods -n datadrift --show-labels
# Fix:      kubectl patch svc datadrift-api-v2 -n datadrift --type merge \
#             -p '{"spec":{"selector":{"app.kubernetes.io/component":"backend","app":null}}}'
apiVersion: v1
kind: Service
metadata:
  name: datadrift-api-v2
  namespace: datadrift
spec:
  selector:
    app: datadrift-backend          # wrong: the backend pods are labelled app.kubernetes.io/component=backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
